[project]
name = "serviceops-telegram-bot"
version = "0.1.0"
description = "Coffee repair service operations Telegram bot"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.7,<4.0",
  "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serviceops_telegram_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
