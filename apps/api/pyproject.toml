[project]
name = "serviceops-api"
version = "0.1.0"
description = "Coffee repair service operations API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.3,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serviceops_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
