[project]
name = "serviceops-worker"
version = "0.1.0"
description = "Coffee repair service operations worker"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4,<6.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serviceops_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
