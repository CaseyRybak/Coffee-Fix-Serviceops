server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /staff\nDisallow: /dispatcher\nDisallow: /technician\nDisallow: /procurement\nDisallow: /inventory\nDisallow: /admin\nDisallow: /owner\nDisallow: /assistant\n";
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location ~* ^/(wp-admin|wp-login|wordpress|xmlrpc\.php|\.env) {
        return 404;
    }

    location ~* \.php$ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location ^~ /status {
        try_files /index.html =404;
    }

    location ^~ /staff {
        try_files /index.html =404;
    }

    location ^~ /dispatcher {
        try_files /index.html =404;
    }

    location ^~ /technician {
        try_files /index.html =404;
    }

    location ^~ /procurement {
        try_files /index.html =404;
    }

    location ^~ /inventory {
        try_files /index.html =404;
    }

    location ^~ /admin {
        try_files /index.html =404;
    }

    location ^~ /owner {
        try_files /index.html =404;
    }

    location ^~ /assistant {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
